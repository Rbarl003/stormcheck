<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StormCheck — Engine Tests</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; color: #1a2433; }
    h1 { margin-bottom: 4px; }
    #summary { font-size: 20px; font-weight: 700; margin: 12px 0 20px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { border-bottom: 1px solid #e1e7ef; padding: 8px; text-align: left; vertical-align: top; }
    .pass { color: #1f8a4c; font-weight: 700; }
    .fail { color: #c0392b; font-weight: 700; }
  </style>
</head>
<body>
  <h1>StormCheck engine tests</h1>
  <p>Runs every sample alert through the engine and compares it to the expected label.</p>
  <div id="summary">Running…</div>
  <table>
    <thead><tr><th>#</th><th>Result</th><th>Expected</th><th>Got</th><th>Score</th><th>Sample</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <script src="../engine.js"></script>
  <script>
    fetch("../data/sample-alerts.json").then((r) => r.json()).then((samples) => {
      let passed = 0;
      const rows = document.getElementById("rows");
      samples.forEach((s) => {
        const r = StormCheckEngine.analyze(s.text);
        const ok = r.label === s.expected;
        if (ok) passed++;
        const tr = document.createElement("tr");
        [s.id, ok ? "PASS" : "FAIL", s.expected, r.label, r.score, s.source].forEach((v, i) => {
          const td = document.createElement("td");
          td.textContent = v;
          if (i === 1) td.className = ok ? "pass" : "fail";
          tr.appendChild(td);
        });
        rows.appendChild(tr);
      });
      const sum = document.getElementById("summary");
      sum.textContent = `${passed} / ${samples.length} passed`;
      sum.className = passed === samples.length ? "pass" : "fail";
    });
  </script>
</body>
</html>
